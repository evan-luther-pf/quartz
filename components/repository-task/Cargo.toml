[package]
name = "quartz-repository-task"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
wit-bindgen = "0.60.0"

[profile.release]
opt-level = "s"
lto = true
strip = "symbols"

[workspace]
