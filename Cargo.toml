[workspace]
members = ["crates/quartz-kernel", "crates/quartz"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.97"

[workspace.dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
thiserror = "2.0.16"
wasmparser = "0.239.0"
wasmtime = { version = "48.0.0", default-features = false, features = ["component-model", "cranelift", "runtime", "std", "wat"] }
